exclude: '^pagefind/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast                 # every Python file parses
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: end-of-file-fixer
        exclude: '^[^/]+\.html$'
      - id: trailing-whitespace
        exclude: '^[^/]+\.html$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--no-fix]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: public-data-contracts
        name: public data contracts
        entry: tools/check_contracts.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: public-privacy
        name: staged public privacy checks
        entry: python3 tools/check_private.py
        language: system
        pass_filenames: false
        always_run: true
