# What runs before every commit.
#
#   pip install pre-commit         install the runner
#   pre-commit run --all-files     run everything now
#   pre-commit autoupdate          move the pinned revs forward
#
# This file is installed as .pre-commit-config.yaml. It is invoked from
# .githooks/pre-commit rather than from .git/hooks, because core.hooksPath
# points at .githooks and git ignores .git/hooks while it does. There is
# therefore no `pre-commit install` step.
#
# Revisions are pinned. An unpinned hook changes what it refuses without a
# diff, which makes a passing commit unreproducible.
#
# These are the general-purpose checks, identical in every repository.
# Repository-specific rules belong in the `local` section at the bottom, or
# in a gate under .gates/ when they need more than a pattern.

# Vendored third-party output. Not ours to format, lint or rewrite, and a
# formatter that touches it fights whatever generated it.
exclude: '^pagefind/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast                 # every Python file parses
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        # Two data files are not valid YAML and never have been: one mixes a
        # top-level mapping with a top-level sequence, the other puts a
        # mapping key among sequence items. Nothing here parses them with a
        # YAML library -- tools/model.py reads them with regular expressions --
        # so the generator tolerates both. Excluded rather than silently
        # reformatted: correcting the structure is a change to the data model
        # and belongs in its own change, with the generated pages compared
        # before and after. Every other data file is checked.
        exclude: '^data/(appearances|teaching)\.yaml$'
      - id: check-toml
      - id: check-added-large-files
      # Generated pages are build output, not source. A formatter that
      # rewrites them fights the generator: the fixer strips the whitespace,
      # the next build re-emits it, and the build never converges. The
      # templates and data they come from are still checked.
      - id: end-of-file-fixer
        exclude: '^[^/]+\.html$'
      - id: trailing-whitespace
        exclude: '^[^/]+\.html$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        # Report only. A linter that edits code on commit changes files the
        # author did not open, which is a decision about style rather than a
        # check for correctness. The rule selection is in ruff.toml.
        args: [--no-fix]

  # Secrets and machine-specific paths. gitleaks is the standard scanner;
  # .gitleaks.toml keeps its default rules and adds one for home-directory
  # paths.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
