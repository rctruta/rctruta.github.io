name: site CI

# The job name below becomes the status-check context branch protection
# requires. Renaming the job silently stops the check arriving, which blocks
# every merge -- the name and the protection rule are one decision.
#
# This repository already has a workflow, pages-build-deployment, but that is
# GitHub's own publisher: it proves the site was DEPLOYED, never that it is
# correct. Requiring it would have been a check that cannot fail for any
# reason a reviewer cares about.

on:
  # Manual trigger, so the check can be proven green BEFORE branch
  # protection requires it. Requiring a context that has never run is how a
  # protection rule blocks every merge on day one.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # No requirements.txt here: the generators are stdlib plus these.
          pip install pydantic jinja2

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v
