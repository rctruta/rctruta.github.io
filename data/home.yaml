description: "Independent researcher measuring how database and AI agent systems behave."

# Markdown links. A link to another page on this site stays in the same tab.
bio: |
  Hi, I'm Ramona, an Independent Researcher, Solutions Architect and [Educator](teaching.html). I bring over 20 years of rigorous [database engineering](work.html#data-engineering) experience to the world of AI; my current focus is on [System Integrity](tags.html#system-integrity)—applying the strict determinism of data engineering to the probabilistic nature of [AI Agents](work.html#agent-evaluation). More to the point, I build [instruments that measure](work.html#benchmarking) whether database and AI agents do, and then [publish the experiment alongside the result](writing.html). In that way, you can [reproduce it](https://github.com/rctruta/sql-benchmarks-dagster) or show me where I'm wrong.

