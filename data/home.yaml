description: "Independent researcher measuring how database and AI agent systems behave."

bio: |
  Hi, I'm Ramona, an Independent Researcher, Solutions Architect and [Educator](teaching.html). I bring over 20 years of rigorous [database engineering](work:data-engineering) experience to the world of AI; my current focus is on [System Integrity](work.html)—applying the strict determinism of data engineering to the probabilistic nature of [AI Agents](work:agent-evaluation). More to the point, I build [instruments that measure](work:benchmarking) whether database and AI agents do, and then [publish the experiment alongside the result](writing.html). In that way, you can [reproduce it](https://github.com/rctruta/sql-benchmarks-dagster) or show me where I'm wrong. This site is built the same way: generated from structured data, with checks that stop the build on invalid records, unknown taxonomy references, or broken local links and anchors.

