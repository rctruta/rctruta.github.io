# Canonical record of every public appearance.
#
# This file is the source of truth. The website renders it; podcast-clips reads
# it as a corpus manifest. Nothing else should keep a second copy.
#
# Vocabulary is fixed — see TAXONOMY.md. The build fails on anything else.
# `title` is the name of the thing and nothing else: role, format and venue
# are fields, never prefixes.
#
# Nothing here records "is it out yet" — that is derived, so it cannot go stale:
#   talk     always rendered; upcoming vs past comes from `date`
#   podcast  rendered once it has a `url`; no url = recorded, not published
# To publish an episode, paste its link. There is no second step.# A line of hers that introduces the guest-host list, kept here rather than in
# the generator.
guest_host_note: "One of the biggest joys in my life is showing up for my friends. Celebrating them."

