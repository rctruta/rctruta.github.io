# Controlled vocabulary for the tags on this site, and the tags each project carries.
#
# THE RULE: a tag must name something at least two pieces of work genuinely share,
# or something a reader would filter on. Everything else is implementation detail
# and belongs in the prose, where it already is.
#
# Decided 2026-09-29, collapsing 54 uncontrolled tags down to this list. Before
# that, 47 of 54 tags appeared exactly once, so clicking one would have shown you
# the page you were already on.
#
# tools/build_tags.py rewrites every tag row from this file and fails on any tag
# not in `vocabulary`. Add the term here first, or the build stops.

vocabulary:
  discipline:
    Data modeling: Representing a domain faithfully, so the structure survives contact with the data.
    Entity resolution: Deciding whether two records describe the same thing, when nothing says so.
    Data quality: Finding what is wrong in source data, and proving it is wrong.
    Benchmarking: Measuring a system under conditions stated well enough to reproduce.
    AI evaluation: Deciding whether a model or agent actually did what it claimed.
    AI security: Attacks on what an agent reads, stores, and later trusts.
    Migration: Moving a working system to a new platform without stopping its users.
    Team leadership: Running the people doing the work, and the mechanism that checks it.
    Teaching: Course material or explanatory writing built so a learner arrives at the answer rather than watching it appear.
    Human agency: What people give up to a system, and what it costs them.
    Storytelling: An analogy from lived experience carrying a technical idea, so the reader arrives at the mechanism through something they already know.
    RLHF: Measuring how RLHF alignment and status bias shift agent decision routing under pressure.

  method:
    Deterministic grading: Scoring outcomes by rule, not by judgement, so a result can be re-derived.
    Per-turn tracing: Recording every step an agent took, rather than asking it afterwards.
    Evaluation sets: A labelled set of cases, built so a system's accuracy is measurable.
    Ablation study: Running the same goals with one thing changed, to isolate what it costs.
    Content-addressed capsules: Fingerprinting the question, so a changed method changes the identifier.
    Cold-cache measurement: Clearing every cache before each run, so the engine is measured and not the buffer pool.
    Git discipline: Enforcing pre-commit gates, claim verification, and reproducible proof state.
    Process telemetry: Deriving quantitative behavioral metrics directly from execution logs without judgment.
    Study contracts: Enforcing reproducible experimental parameters via immutable YAML schemas.

  technology:
    PostgreSQL:
    DuckDB:
    Python:
    Dagster:
    Polars:
    Arrow / ADBC:
    MCP:
    RAG:
    SQL:
    XQuery:
    LanceDB:
    Knowledge graphs:
    # Steganography:
    # Vision security:

