      - id: agent-telemetry
        title: "agent-telemetry — transcript-derived process metrology for coding agents"
        activity: built
        tags: [AI evaluation, Process telemetry, Deterministic grading, Python]
        description: |
          A local analytics package that parses raw JSONL session transcripts from coding agents (Claude Code) into un-opinionated process metrics: `tool_calls_per_turn`, `reads_before_first_edit`, `repeated_commands`, `error_rate`, `seconds_to_first_write`, and `edit_revisits`.

          Prose instructions (in `CLAUDE.md` or prompt guidance) are hypotheses about agent behavior. By comparing session telemetry before and after introducing a rule, `agent-telemetry` evaluates whether a prompt-level instruction actually shifted model behavior. If a rule does not move its metric, the rule does not bind.
        links:
          - text: "agent-telemetry"
            url: "https://github.com/rctruta/agent-telemetry"
      - id: rag-accuracy
        title: "A RAG system answering 17 of 20 questions its sources couldn't support"
        summary: "Ask a question about a podcast, get an answer and a link to the exact second someone said it. LanceDB, local-first, no cluster and no API key. Built a labelled eval set and found it answering 17 of 20 questions its sources couldn't support; recalibrated precision 0.56 → 0.87."
        activity: built
        tags: [AI evaluation, Evaluation sets, Python, RAG, LanceDB]
        description: |
          I built a labelled evaluation set for a retrieval system I had written myself, and found it answering fluently, with citations, and with no error of any kind. Recalibrated the refusal threshold from 0.56 to 0.87 precision and validated out-of-sample. Confident output is not evidence; the failure mode to fear is the plausible one, not the obvious one.

          Runs entirely from a local directory — LanceDB for vector, full-text and hybrid search, sentence-transformers for embeddings, no hosted cluster and no API key. Ask a question, get an answer and a link to the timestamp where it's answered.
        links:
          - text: "podcast-rag"
            url: "https://github.com/rctruta/podcast-rag"
      - id: music-recommender
        title: "Music recommendation system — MIT Professional Education capstone"
        activity: research
        tags: [AI evaluation, Evaluation sets, Python]
        description: |
          Top-10 song recommendation over the Million Song Dataset Taste Profile Subset: two million listening events, ten thousand songs. Four algorithm families compared — user-user and item-item collaborative filtering, SVD matrix factorization, co-clustering, and content-based — with grid-search cross-validation over each.

          Revisited in 2026, the interesting result is the evaluation rather than the models. Every one of the eight configurations reported Precision@10 of 1.0 while RMSE sat between 1.009 and 1.088, which cannot both be true of a working measurement. The relevance threshold was a play count of one, and the test set contains only songs a user already played — so every candidate counted as relevant and the metric reduced to k/k. Perfect scores produced by arithmetic, not by the recommenders.
        links:
          - text: "music_recommendation_system"
            url: "https://github.com/rctruta/music_recommendation_system"

  - id: memory-security
    title: "AI security"
    summary: "Attacks on what an agent reads, stores and later trusts — and the controls that hold against them. Maps to [OWASP LLM01 (indirect prompt injection)](https://genai.owasp.org/llmrisk/llm01-prompt-injection/) and [OWASP LLM04 (data poisoning)](https://genai.owasp.org/llmrisk/llm04-data-and-model-poisoning/)."
    items:
      - id: agent-memory
        title: "Semantic injection into agent memory"
        activity: research
        tags: [AI security, AI evaluation]
        description: |
          A deterministic exploit against an open-source agent memory system: text that reads as ordinary content to a human, but that the extraction pipeline turns into a stored fact the agent later treats as its own knowledge. Disclosed responsibly. Separately, a forensic read of a coding agent's local state directory — what it writes to disk, in plaintext, without telling you.
        links:
          - text: "The Blueberry Muffin Exploit"
            url: "https://ramonactruta.substack.com/p/the-blueberry-muffin-exploit-semantic"
          - text: "Inside ~/.claude/"
            url: "https://ramonactruta.substack.com/p/inside-claude-structure-is-not-security"
        notes:
          - text: "Authorised researcher, Anthropic Cyber Verification Program."
      - id: consensus-contagion
        title: "Consensus Contagion — status bias and the RLHF tax in agent routing"
        activity: research
        tags: [AI evaluation, Deterministic grading, Ablation study, RLHF, Data contracts, AI security, Python]
        description: |
          Based on my **adversarial-judgement-research** framework (14 study contracts, 205 graded runs across 10 models from 4 vendors, with a successor testbed extending the matrix to local models): I proved that generalized LLM orchestrators evaluate simulated social status over technical merit. Injecting a high-status persona into routing decisions causes agentic state to collapse into authority bias (the RLHF tax). Prompt-level instructions fail under pressure; mechanical gates hold.
        summary: "Metatracing engine and execution traces for structural failure modes in multi-agent LLM consensus pipelines: status bias, persona bleed, frame break, axiomatic refusal, consensus contagion, semantic camouflage."
        links:
          - text: "adversarial-judgement-research"
            url: "https://github.com/rctruta/adversarial-judgement-research"
        notes:
          - text: "Presented at the Canadian Women in Cybersecurity Conference, Toronto, May 2026."
          - text: "Experiments varying a protected attribute are held back, with their findings: a single name pair cannot separate a name-specific effect from a systematic one. The published README says so rather than leaving a gap."
      - id: security-testbed
        title: "AI security testbed — semantic privilege escalation under adversarial audit"
        activity: research
        tags: [AI security, AI evaluation, Deterministic grading, Ablation study, Content addressing, Python]
        description: |
          The successor to **adversarial-judgement-research**, built to test one premise: that
          wrapping a model in a system prompt does not make a multi-agent pipeline secure, because
          the control plane and the data plane are both just text. A transformer has no role-based
          access control, so an instruction and a social authority payload arrive the same way.

          A deterministic matrix engine runs a 2x2 factorial at temperature 0 with replication,
          sweeping model, adversary status and thinking budget, and grades every run by rule. The
          corpus is 416 traces across frontier and local models — GPT-4.1, Gemini 3.1 Pro, Claude
          Opus 4.6, Cohere Command-R, Groq, HuggingFace, and Ollama running llama3, mistral and
          gemma2 on my own machine. Running the same scenarios locally is what makes the sweep
          affordable to replicate rather than a one-off purchase.

          Findings are held for disclosure: the study names specific models and versions, and a
          vendor-identifying result belongs with its vendor before it belongs on a website.
        notes:
          - text: "Repository private while the findings are prepared for disclosure."
      - id: agent-tools
        title: "Tools and playbooks for collaborating with coding agents"
        summary: "Boilerplate and security guidelines for collaborating safely with autonomous coding agents, with the gates already enforced rather than written down and hoped for."
        activity: built
        tags: [AI security, Deterministic grading, Python, Pre-commit gates]
        description: |
          **ai-agent-utils** — a bootstrap that starts a repository with gates already enforced, rather than rules written down and hoped for. Two families: git discipline, and claim integrity — every load-bearing number registered with a source and re-checked before commit, fabricated claims blocked by pattern, and a checkpoint that refuses to record a working state unless a proof command passes. Enforcement is git hooks and stdlib scripts, so it binds whichever agent is driving; the Claude and Cursor files only describe it. **The Pedantic Medallion** — community-curated playbooks for building shared understanding, from the framework of the same name.
        links:
          - text: "ai-agent-utils"
            url: "https://github.com/rctruta/ai-agent-utils"
          - text: "awesome-pedantic-medallion"
            url: "https://github.com/rctruta/awesome-pedantic-medallion"
          - text: "A README is a Set of Falsifiable Claims"
            url: "https://ramonactruta.substack.com/p/a-readme-is-a-set-of-falsifiable"
