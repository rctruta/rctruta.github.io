    items:
      - quote: "You have really touched my life… I enjoyed your database class mostly because it was you that taught it, and I always tell people that you were my mentor and motivated me to go to GHC, from where everything started happening for me… you have had a big role in my life."
        cite: "a student, CSCC43 — later a computer vision researcher"
      - quote: "I have spent almost 40 minutes ONLY to understand your solution… Eventually, I understood it. I write to thank you for having shown us the beauty of Relational Algebra. The query is indeed very smart. I am totally impressed. Well, please show us more and more issues like this… (Not on the exam, though.)"
        cite: "a student, sent at 4:17 in the morning"
      - quote: "Ramona was teaching us about database pages. Instead of just drawing the example on the board she used large lego blocks, that she joked about stealing from her daughter, to not only explain the topic but also to make it more fun."
        cite: "a student, CSC343"
      - quote: "Wow, a personal message from an instructor? That's quite unusual."
        cite: "a student, after I wrote to thank him for helping others on the course forum"
      - quote: "I still remember how you told me not to give up and keep the door open by applying for graduate schools. Thank you Ramona! All these won't come true without your encouragement."
        cite: "a student, on getting into graduate school"
      - quote: "I don't think many younger students could ever understand how difficult it is to do the job the way you do, and with tact and grace."
        cite: "a student who organised a teaching award nomination"
      - quote: "She made herself readily available in extra office hours — a number of times at some late or early hours according to the students need — which other instructors simply would never do."
        cite: "a student, CSC343"
    postscript: "At the end of one course, a group of around ten students wrote to the department unprompted to nominate me for a teaching award. One of them asked my permission first, in case I would rather they didn't."

  years_later:
    note: "Written publicly, under their own names, by students who took my courses and then went on to build things."
    items:
      - quote: "I took my most important undergrad database course with Ramona almost two decades ago, grateful for her kindness and patience in her instructional style. She was one of the most caring undergraduate Prof at UofT."
        cite: "Mohammad Sadoghi — Professor and Chancellor's Fellow, UC Davis"
      - quote: "I've learned many concepts from Ramona on software engineering, design patterns, databases — many of which I use to this day in my career as a software engineer, and am forever grateful to her… remarkably knowledgeable, yet very humble and down to earth."
        cite: "Meisam Aliroteh — Principal Software Development Engineer, Salesforce"
      - quote: "I still remember all those lessons that Ramona taught me in my software engineering classes. I remember them because I use those lessons on daily basis. She greatly tuned me up in fundamentals of my field — OOP, OOAD, relational database design, design patterns, refactoring strategies and many more."
        cite: "Yousif Atique — Principal Software Engineer, ICE"
      - quote: "She is very knowledgeable about engineering and database technology and has a knack for explaining complex concepts in ways that are practical and comprehensible. Her teaching methods were influential in my own data modeling and data architecture career."
        cite: "Agatha Colangelo — Manager, Data ITG Architect, Canada Post"
      - quote: "Her storytelling ability allows her to decompose complex domain knowledge into simpler terms allowing others to digest it… Ramona demonstrates the trials and skills of an agile leader and a change catalyst with a data-driven mindset."
        cite: "Toni Lee — former student, on problem solving and value delivery"
      - quote: "Extremely supportive, and very knowledgeable in her field. She can be a great asset to any team, both as a leader and as a hands on person that would take a scientific approach to solving problems and moving things forward."
        cite: "Shayan Hamidi — Founder and CEO; supervised project course, later a company of his own"

materials:
  - id: xquery-assignment
    title: "CSC343 Introduction to Databases, Assignment 3"
    activity: course material
    url: "assets/csc343-clinical-trials-xquery.pdf"
    meta: "PDF, 6 pages"
    tags: [Data modeling, Teaching, XQuery]
    description: |
      Students were given 10,000 XML records of real clinical trials from [clinicaltrials.gov](https://clinicaltrials.gov/), with the collection's DTD. Before writing a query they had to read that DTD and explore the registry's own search interface — ten of the hundred points, awarded to anyone who submitted anything, because the point was to make them look at the data. Then seven XQuery queries against a 114MB collection, each in its own file, each output in its own, run through Saxon.

      Structure rules and content rules stated up front, so an answer was checkable rather than arguable. The XQuery came from my own M.Sc. research on structural and semantic query optimization; the data came from a government registry that was live while they worked on it.

  - id: nf-handout
    title: "3NF decomposition, worked live"
    activity: course material
    url: "assets/csc343-3nf-decomposition.pdf"
    meta: "PDF, 4 pages"
    tags: [Data modeling, Teaching]
    description: |
      These handouts were something I introduced, and nobody asked me to. Each one is deliberately empty: a relation, its functional dependencies, then every step of the decomposition printed with its algorithm above it and the answer left blank — closures, candidate keys, minimal cover, redundant attributes on the left-hand side, redundant dependencies, the decomposition itself.

      I brought them to class and we worked the problem together, me at the blackboard and the students filling in their own copies. That is the difference between watching a result appear and arriving at one. It also meant writing every handout myself, before every lecture that used one.

